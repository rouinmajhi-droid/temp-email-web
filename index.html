<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Email & API Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #334155; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 15px; color: #38bdf8; font-size: 20px; }
        .box { background-color: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input[type="number"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; margin-bottom: 10px; font-size: 15px; }
        button { width: 100%; padding: 11px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #0369a1; }
        .key-display { word-break: break-all; font-family: monospace; color: #22c55e; background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; border: 1px dashed #22c55e; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { width: auto; padding: 5px 10px; background-color: #10b981; font-size: 12px; border-radius: 4px; margin-left: 8px; }
        .list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .item { background-color: #1e293b; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📧 Website API & Email Generator</h2>

        <!-- Section 1: API Key Generator -->
        <div class="box">
            <label>Apni Website ki API Key Generate Karein:</label>
            <button onclick="generateApiKey()" style="background-color: #10b981;">Generate API Key</button>
            <div id="keyBox" style="display:none;" class="key-display">
                <span id="keyValue"></span>
                <button class="copy-btn" onclick="copyKey()">Copy Key</button>
            </div>
        </div>

        <!-- Section 2: Email Generator Box for Bot/User -->
        <div class="box">
            <label for="count">Kitne Emails Generate Karne Hain?</label>
            <input type="number" id="count" value="5" min="1" max="50">
            <button onclick="generateEmailsFromWebsite()">Generate Emails</button>
            
            <div id="status" style="margin-top: 10px; font-size: 13px; text-align: center;"></div>
            <div id="emailList" class="list"></div>
        </div>
    </div>

    <script>
        // Aapka local server URL
        const API_BASE = 'http://127.0.0.1:5000';

        // Website ke andar hi API Key generate karne ka function
        function generateApiKey() {
            const keyBox = document.getElementById('keyBox');
            const keyValue = document.getElementById('keyValue');
            
            // Random unique API key website par hi ban jayegi
            const randomKey = 'rabin_web_key_' + Math.random().toString(36.substring(2) + Date.now().toString(36);
            
            keyBox.style.display = 'flex';
            keyValue.innerText = randomKey;
            
            // LocalStorage mein save kar lenge taaki yaad rahe
            localStorage.setItem('bot_api_key', randomKey);
        }

        function copyKey() {
            const keyText = document.getElementById('keyValue').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('API Key Copied Successfully!');
            });
        }

        // Website se server par request bhej kar emails generate karna
        async function generateEmailsFromWebsite() {
            const count = document.getElementById('count').value;
            const emailList = document.getElementById('emailList');
            const status = document.getElementById('status');
            const savedKey = localStorage.getItem('bot_api_key');

            if (!savedKey) {
                alert('Pehle "Generate API Key" par click karke API Key banayein!');
                return;
            }

            emailList.innerHTML = '';
            status.style.color = '#38bdf8';
            status.innerText = 'Server se email generate ho rahe hain...';

            try {
                // Aapke purane local server wale endpoint par request jayegi
                const response = await fetch(`${API_BASE}/generate?count=${count}`);
                const data = await response.json();

                status.style.color = '#22c55e';
                status.innerText = `Success! ${data.generated.length} emails mil gaye.`;

                data.generated.excluded = true;
                data.generated.forEach((email) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:5px;">${email}</span>
                        <button class="copy-btn" onclick="copyEmail('${email}', this)">Copy</button>
                    `;
                    emailList.appendChild(div);
                });

            } catch (err) {
                status.style.color = '#ef4444';
                status.innerText = 'Error: Local server connect nahi ho pa raha!';
            }
        }

        function copyEmail(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = 'Copy'; }, 1500);
            });
        }
    </script>
</body>
</html>
